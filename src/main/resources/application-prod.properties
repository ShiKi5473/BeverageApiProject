# ===================================================================
# 正式環境設定 (SPRING_PROFILES_ACTIVE=prod)
# 所有機密 (JWT_SECRET、資料庫密碼、MinIO、RabbitMQ 等) 一律由環境變數提供，不寫在檔案中。
# ===================================================================

# 關閉 Swagger UI 與 OpenAPI 文件，避免對外暴露 API 結構
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 追蹤取樣率降為 10%，降低 Zipkin 與效能負擔
management.tracing.sampling.probability=0.1

# 不輸出 SQL，避免洩漏資料結構並降低 log 量
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 正式環境只暴露必要的 actuator 端點
management.endpoints.web.exposure.include=health,info,prometheus

# CORS：請以環境變數 APP_CORS_ALLOWED_ORIGINS 指定正式前端網域（覆寫 application.properties 內的 localhost 預設值）
