# 開發環境設定 (SPRING_PROFILES_ACTIVE=dev)；會執行 DataSeeder，絕不可用於正式環境。
# MinIO / RabbitMQ / MongoDB 等共用設定已統一放在 application.properties（原本在此重複，且 Mongo URI 版本過舊）。

spring.datasource.driver-class-name=org.postgresql.Driver
# 連線埠與 docker-compose.yml 的 postgres 對外埠一致（皆為 POSTGRES_PORT，預設 5473）
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5473}/BeverageApiDatabase
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 找不到版本記錄表時自動建立並以版本 1 為基準 (Baseline)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 開發環境全量取樣 (正式環境見 application-prod.properties 的 0.1)
management.tracing.sampling.probability=1.0
# 開發時多暴露 metrics / prometheus 方便查看
management.endpoints.web.exposure.include=health,info,metrics,prometheus
