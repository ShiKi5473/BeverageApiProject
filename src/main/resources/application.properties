spring.application.name=beverage-api-project

# ===================================================================
# 主要應用程式設定
# ===================================================================

# 【關鍵】從專案根目錄下的 .env 檔案中匯入額外的設定。
# "optional:file:.env" 的意思是：
# - optional: 如果 .env 檔案不存在，應用程式也不會啟動失敗。
# - file:     告訴 Spring 從檔案系統中尋找檔案。
# - .env:     檔案的路徑。在開發時，這通常是相對於專案的根目錄。
spring.config.import=optional:file:.env

# 【安全修正 S-3】已移除預設的 spring.profiles.active=dev。
# dev profile 會執行 DataSeeder（重設已知密碼 password123 的 BRAND_ADMIN），
# 若正式環境忘記覆寫就會被植入弱密碼帳號。
# 本機開發請自行啟用：在 .env 加入 SPRING_PROFILES_ACTIVE=dev，
# 或以環境變數 / --spring.profiles.active=dev 指定；正式環境使用 SPRING_PROFILES_ACTIVE=prod。

# ===================================================================
# 非機密設定 (可以安全提交到 Git)
# ===================================================================

# ===================================================================
# CORS 設定
# ===================================================================
# 允許的前端來源，多個來源以逗號分隔。
# 正式環境請在 application-prod.properties 覆寫此設定，移除開發用的 localhost。
app.cors.allowed-origins=http://localhost:63342,http://127.0.0.1:63342,http://localhost:5173,http://127.0.0.1:5173

# JWT 過期時間 (毫秒)
app.jwt.expiration-in-ms=86400000

# 營業時區：訂單流水號每日重置與日結報表皆以此時區計算（見 TimeConfig）
app.timezone=Asia/Taipei

# Jackson 時區：java.util.Date / Instant 序列化時使用台北時區，避免 Docker 預設 UTC 造成 8 小時偏移
spring.jackson.time-zone=Asia/Taipei

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT 簽章密鑰：必須提供 512-bit 以上的 Base64 字串。
# 【安全修正 S-3】已移除寫死的預設值：未設定 JWT_SECRET 時應用程式啟動即失敗（fail fast），
# 避免正式環境不小心使用公開在原始碼中的密鑰。請由環境變數或 .env 提供 JWT_SECRET。
app.jwt.secret=${JWT_SECRET}

# ===================================================================
# 檔案上傳 (Multipart) 限制
# ===================================================================
# 分片上傳每片大小上限；請求總大小略大於單檔以容納表單欄位
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ===================================================================
# MinIO Object Storage
# ===================================================================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:beverage-files}

# ===================================================================
# RabbitMQ Configuration
# ===================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# 開啟發送確認與回調 (callback 於 RabbitConfig 的 RabbitTemplateCustomizer 設定)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# 消費者重試與毒訊息處理（B-4）：
# 先前消費者拋出例外時預設會無限 requeue，毒訊息永遠重送、DLQ 收不到。
# 現在最多嘗試 3 次（間隔 1s、2s 指數退避），仍失敗就不再 requeue，交由 DLX 轉進已宣告的 DLQ。
# 修改說明（m-1）：線上訂單消費者改用 RabbitConfig.onlineOrderListenerContainerFactory，
# 次數 / 退避仍讀取下列設定，但「業務 / 驗證錯誤」（AppException、DomainException、AmqpRejectAndDontRequeueException、
# 訊息轉換錯誤）不重試、直接進 DLQ；只有暫時性錯誤才重試，且 ticket 只在最後一次失敗時才標為 FAILED。
# retry.enabled=false 時線上訂單只嘗試 1 次（仍會標記 FAILED 並轉入 DLQ）。KDS 等其他監聽者沿用 Boot 預設行為。
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ===================================================================
# MongoDB Configuration (Audit Log)
# ===================================================================
# 修正：原本註解黏在 URI 值的後面（沒有換行），會變成 URI 的一部分，非 dev profile 會連線失敗。
# 若在 Docker 內部互連，通常會用 host 名稱 'mongo'（透過 SPRING_DATA_MONGODB_URI 覆寫）；
# 本機開發時 localhost:27017 透過 Port Forwarding 連線。
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongoadmin:mongoadmin@localhost:27017/beverage_audit_db?authSource=admin}

# ===================================================================
# Observability（所有 profile 共用）
# ===================================================================
# Zipkin 位址：原本只寫在 application-dev.properties，prod 啟動後 ZIPKIN_ENDPOINT 環境變數不會生效，已移到共用設定
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
# log 格式加入 Trace ID 與 Span ID，例如：INFO [beverage-api-project,651a2b3c4d5e6f,12345678]
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
management.endpoints.web.exposure.include=health,info
