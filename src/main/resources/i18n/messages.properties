# ============================================================
# 預設錯誤訊息（繁體中文）
# Spring MessageSource 設定於 I18nConfig，baseName = classpath:i18n/messages
# ============================================================

# 庫存相關
error.inventory.insufficient=庫存不足（品項：{0}）。現有：{1}，需求：{2}

# 通用資源找不到
error.resource.not_found=找不到資源：{0}

# 請求格式錯誤
error.bad_request=請求錯誤：{0}

# 業務規則違反
error.domain=業務規則錯誤：{0}

# 未授權
error.unauthorized=未授權，請重新登入

# 禁止存取
error.forbidden=權限不足，無法執行此操作
