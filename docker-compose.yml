services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # 不再寫死 dev：預設 dev 供本機 compose 使用；正式環境請設定 SPRING_PROFILES_ACTIVE=prod
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      # JWT 密鑰必須由環境變數 / .env 提供（512-bit Base64），未設定時 compose 直接報錯，不使用預設值
      - JWT_SECRET=${JWT_SECRET:?請在環境變數或 .env 設定 JWT_SECRET (512-bit Base64)}
      # 容器時區，與 Dockerfile 一致，確保訂單流水號與日結以台北時間計算
      - TZ=Asia/Taipei
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/BeverageApiDatabase
      - SPRING_DATASOURCE_USERNAME=postgres
      # 密碼一律由環境變數 / .env 提供（未設定時僅本機開發用預設值），不再寫死
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_USER:-mongoadmin}:${MONGO_PASSWORD:-mongoadmin}@mongo:27017/beverage_audit_db?authSource=admin
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
      - mongo

  postgres:
    image: postgres:17.5
    ports:
      # 對外埠與 application-dev.properties 一致（POSTGRES_PORT，預設 5473）
      - "${POSTGRES_PORT:-5473}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=BeverageApiDatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    # MongoDB 服務
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-mongoadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-mongoadmin}
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
